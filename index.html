<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>전기기사 49일 플랜</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #1c2128;
    --card: #262c35;
    --card2: #2c333d;
    --border: #3a4250;
    --text: #eaf0f7;
    --sub: #9aa8bd;
    --subdim: #7f8da3;
    --accent: #5aa9ff;
    --accent2: #ffb454;
    --good: #3ddc84;
    --bad: #ff6b6b;
  }
  body {
    margin: 0; padding: 0 0 50px;
    background:
      radial-gradient(circle at 15% 0%, rgba(90,169,255,0.10), transparent 40%),
      radial-gradient(circle at 85% 8%, rgba(255,180,84,0.08), transparent 35%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: calc(16px + env(safe-area-inset-top)) 12px 0; max-width: 640px; margin: 0 auto; }
  @media (min-width: 700px) { .wrap { padding: calc(28px + env(safe-area-inset-top)) 20px 0; } }

  /* ---- Header ---- */
  .hero { text-align:center; margin-bottom:12px; }
  .hero .badge {
    display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.5px;
    color:var(--accent); background:rgba(90,169,255,0.12); border:1px solid rgba(90,169,255,0.3);
    padding:3px 10px; border-radius:20px; margin-bottom:8px;
  }
  .hero h1 {
    font-size:21px; margin:0 0 4px; font-weight:800;
    background:linear-gradient(90deg,#fff,#a8c8ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero .sub { color:var(--sub); font-size:12px; }

  /* ---- Today card ---- */
  .today-card {
    background:linear-gradient(155deg, #17324d, #101820 65%);
    border:1px solid #234261; border-radius:18px; padding:16px;
    margin-bottom:14px; position:relative; overflow:hidden;
  }
  .today-card::after {
    content:""; position:absolute; top:-30px; right:-30px; width:120px; height:120px;
    background:radial-gradient(circle, rgba(90,169,255,0.25), transparent 70%);
  }
  .today-card .tc-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .today-card .tc-label { font-size:11px; color:#9fc2ff; font-weight:700; letter-spacing:.3px; }
  .today-card .tc-tag { font-size:10px; font-weight:700; padding:2px 9px; border-radius:20px; color:#12161c; }
  .today-card .tc-title { font-size:15.5px; font-weight:700; margin-bottom:10px; line-height:1.4; }
  .today-card .tc-tasks { display:flex; flex-direction:column; gap:6px; margin-bottom:4px; }
  .today-card .tc-task {
    display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:#dce6f2;
    background:rgba(255,255,255,0.04); border-radius:9px; padding:8px 9px;
  }
  .today-card .tc-task input { width:17px; height:17px; margin-top:1px; accent-color:var(--good); flex-shrink:0; }
  .today-card .tc-task.done label { color:var(--subdim); text-decoration:line-through; }
  .today-card .tc-more {
    margin-top:10px; width:100%; padding:9px; border-radius:10px; border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.06); color:#fff; font-size:12.5px; font-weight:600;
  }
  .today-card.no-plan { text-align:center; padding:20px 16px; }
  .today-card.no-plan .tc-title { font-size:13.5px; color:#c2cee0; margin:0; }

  /* ---- Stats ---- */
  .stats { display:flex; gap:7px; margin-bottom:10px; }
  .stat {
    flex:1; background:var(--card); border:1px solid var(--border); border-radius:13px;
    padding:11px 5px; text-align:center;
  }
  .stat .num { font-size:22px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
  .stat .lbl { font-size:9px; color:var(--sub); margin-top:3px; font-weight:600; }
  .stat .bar { height:5px; background:#1c232f; border-radius:3px; margin-top:7px; overflow:hidden; }
  .stat .bar i { display:block; height:100%; border-radius:3px; transition:width .3s ease; }
  .stat.plan .num { color:var(--accent2); }
  .stat.plan .bar i { background:linear-gradient(90deg,#ffb454,#ff8a3d); }
  .stat.real .bar i { background:linear-gradient(90deg,#3ddc84,#22b56b); }
  .stat.streak .num { color:#ff9f6b; }

  /* ---- Quick links ---- */
  .linkrow { display:flex; gap:8px; margin-bottom:16px; }
  .linkrow a {
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:12px; font-weight:600; color:var(--text); text-decoration:none;
    border:1px solid var(--border); padding:10px 8px; border-radius:12px; background:var(--card);
  }
  .linkrow a .ic { font-size:14px; }
  .linkrow a.store { border-color:rgba(61,220,132,0.35); background:rgba(61,220,132,0.08); color:#8ff0bd; }

  /* ---- Cheatkey fullscreen overlay ---- */
  .cheat-overlay {
    display:none; position:fixed; inset:0; z-index:100; background:var(--bg);
  }
  .cheat-overlay.show { display:flex; flex-direction:column; }
  .cheat-overlay .cheat-bar {
    display:flex; align-items:center; justify-content:space-between;
    padding: max(10px, env(safe-area-inset-top)) 12px 10px;
    background:var(--card); border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .cheat-overlay .cheat-title { font-size:14px; font-weight:800; color:var(--text); }
  .cheat-overlay .cheat-close {
    width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--card2);
    color:var(--text); font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center;
    line-height:1; cursor:pointer; padding:0;
  }
  .cheat-overlay .cheat-close:active { transform:scale(0.9); }
  .cheat-overlay iframe {
    flex:1; width:100%; border:none; background:var(--bg);
  }

  /* ---- Calendar card w/ month navigation ---- */
  .cal-card { background:var(--card2); border:1px solid var(--border); border-radius:16px; padding: clamp(10px,2vw,18px); margin-bottom:16px; }
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-header .cal-title { font-size:14.5px; font-weight:800; color:var(--text); display:flex; align-items:center; gap:7px; }
  .cal-header .cal-title::before { content:""; width:4px; height:14px; background:var(--accent); border-radius:2px; display:inline-block; }
  .cal-btn {
    width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:var(--card);
    color:var(--text); font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center;
    line-height:1; cursor:pointer; padding:0;
  }
  .cal-btn:active { transform:scale(0.9); }
  .cal-btn:disabled { opacity:.3; cursor:default; }
  .grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: clamp(3px, 0.9vw, 7px); }
  .wd { text-align:center; font-size: clamp(9.5px, 1.4vw, 12px); color:var(--sub); padding-bottom:3px; font-weight:700; }
  .cell {
    aspect-ratio: 1 / 1; border-radius:10px; padding: clamp(3px,1vw,7px);
    background:var(--card); border:1px solid var(--border); position:relative;
    font-size: clamp(8.5px, 1.4vw, 11px); line-height:1.15; cursor:pointer;
    overflow:hidden; display:flex; flex-direction:column;
    transition: transform .1s ease;
  }
  .cell:active { transform: scale(0.94); }
  .cell.empty { background:transparent; border:none; cursor:default; }
  .cell .dnum { font-size: clamp(7.5px, 1.1vw, 9.5px); color:var(--sub); font-weight:600; }
  .cell .date { font-size: clamp(9.5px, 1.6vw, 13px); font-weight:700; color:var(--text); }
  .cell .tag { display:inline-block; margin-top:1px; padding: clamp(1px,0.3vw,2px) clamp(3px,0.6vw,6px); border-radius:5px; font-size: clamp(7px,1vw,9px); font-weight:700; color:#12161c; }
  .cell .topic { margin-top:1px; color:#c2cddc; font-size: clamp(7.5px, 1.1vw, 9.5px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cell.today { border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent) inset, 0 0 14px rgba(90,169,255,0.25); }
  .cell.exam { background:linear-gradient(155deg,#3a1418,#1a0d10); border-color:var(--bad); }
  .cell.exam .date { color:#ff8f8f; }
  .cell.rest { background:var(--card); }
  .cell.done { border-color:rgba(61,220,132,0.5); }
  .cell .check {
    position:absolute; top:4px; right:4px; font-size:10px; color:var(--good);
  }
  .cell .curbadge {
    display:inline-block; margin-top:2px; margin-left:4px; font-size:7.5px; font-weight:800;
    color:#12161c; background:var(--accent2); padding:1px 5px; border-radius:5px; vertical-align:middle;
  }
  .cell .prog { position:absolute; bottom:0; left:0; height:3px; background:var(--good); border-radius:0 0 10px 10px; transition:width .3s; }

  .c-circuit { background:#5aa9ff; }
  .c-control { background:#3ddc84; }
  .c-magnetic { background:#ffb454; }
  .c-machine { background:#c792ff; }
  .c-power { background:#ff6b6b; }
  .c-kec { background:#3ddceb; }
  .c-exam { background:#9aa7ba; }

  footer { text-align:center; color:var(--subdim); font-size:11px; margin-top:20px; padding:0 14px; }

  /* ---- modal ---- */
  .overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter: blur(2px);
    z-index:50; align-items:flex-end; justify-content:center;
  }
  .overlay.show { display:flex; }
  .sheet {
    background:var(--card); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    max-height:85vh; overflow-y:auto; padding:18px 16px 30px;
    border-top:1px solid var(--border); animation: slideup .2s ease;
  }
  @keyframes slideup { from { transform:translateY(30px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .sheet-handle { width:36px; height:4px; background:#2a3242; border-radius:2px; margin:0 auto 14px; }
  .sheet-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .sheet-header h3 { font-size:17px; margin:0; font-weight:800; }
  .sheet-tag { font-size:10px; font-weight:700; padding:3px 9px; border-radius:7px; color:#12161c; }
  .sheet-date { font-size:12px; color:var(--sub); margin-bottom:14px; }
  .sheet-title { font-size:14.5px; font-weight:700; margin-bottom:12px; color:var(--text); line-height:1.4; }

  .formula-box {
    background:var(--bg); border:1px solid var(--border); border-radius:11px;
    padding:11px 13px; margin-bottom:8px; font-size:12.5px; color:#c3cfdf; line-height:1.65;
  }
  .formula-box::before { content:"📐 "; }

  .tasklist { margin-top:16px; }
  .tasklist h4 { font-size:12px; color:var(--sub); margin:0 0 8px; font-weight:700; }
  .task {
    display:flex; align-items:flex-start; gap:9px; padding:10px 9px;
    border-radius:10px; margin-bottom:6px; background:var(--bg); border:1px solid var(--border);
  }
  .task input { width:18px; height:18px; margin-top:1px; accent-color:var(--good); flex-shrink:0; }
  .task label { font-size:13px; color:var(--text); line-height:1.45; }
  .task.done { opacity:.75; }
  .task.done label { color:var(--subdim); text-decoration:line-through; }

  .close-btn {
    width:100%; margin-top:18px; padding:12px; border:none; border-radius:12px;
    background:var(--accent); color:#12161c; font-size:14px; font-weight:800;
  }
</style>
</head>
<body>
<div class="cheat-overlay" id="cheatOverlay">
  <div class="cheat-bar">
    <div class="cheat-title" id="cheatTitle">🗝️ 암기카드</div>
    <button class="cheat-close" onclick="closeCheatOverlay()" aria-label="닫기">✕</button>
  </div>
  <iframe id="cheatFrame" src="" title="암기카드"></iframe>
</div>
<div class="wrap">

<div class="hero">
  <h1>전기기사 49일 플랜</h1>
  <div class="sub">2026년 8월 27일 시험 · 하루하루 체크하며 완주하기</div>
</div>

<div class="stats">
  <div class="stat"><div class="num" id="dday">-</div><div class="lbl">D-DAY</div></div>
  <div class="stat plan"><div class="num" id="planpct">0%</div><div class="lbl">📅 계획 진행률</div><div class="bar"><i id="planbar" style="width:0%"></i></div></div>
  <div class="stat real"><div class="num" id="pct">0%</div><div class="lbl">✅ 실제 진행률</div><div class="bar"><i id="pctbar" style="width:0%"></i></div></div>
  <div class="stat streak"><div class="num" id="streak">0일</div><div class="lbl">🔥 연속 완료</div></div>
</div>

<div class="linkrow">
  <a href="#" onclick="openCheatOverlay('https://ohmmygod81.github.io/1page/', '전트키'); return false;"><span class="ic">🔗</span>전트키 바로가기</a>
</div>

<div id="todayCard"></div>

<div class="cal-card">
  <div class="cal-header">
    <button class="cal-btn" id="prevMonthBtn" onclick="prevMonth()" aria-label="이전 달">‹</button>
    <div class="cal-title" id="calTitle">-</div>
    <button class="cal-btn" id="nextMonthBtn" onclick="nextMonth()" aria-label="다음 달">›</button>
  </div>
  <div class="grid" id="calGrid"></div>
</div>

<footer>ohmmygod81.github.io/Plan · 목표: 과목당 40점↑ 평균 60점 🎯</footer>

</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 id="sheetTitle">Day</h3>
      <span class="sheet-tag" id="sheetTag">과목</span>
    </div>
    <div class="sheet-date" id="sheetDate"></div>
    <div id="sheetTopic" class="sheet-title"></div>
    <div id="sheetFormulas"></div>
    <div class="tasklist">
      <h4>✅ 오늘 할 일 (체크하면 저장돼요)</h4>
      <div id="sheetTasks"></div>
    </div>
    <button class="close-btn" onclick="closeSheet()">닫기</button>
  </div>
</div>

<script>
const catNames = {circuit:"회로이론",control:"제어공학",magnetic:"전자기학",machine:"전기기기",power:"전력공학",kec:"KEC",exam:"기출풀이"};
const catIcons = {circuit:"🔌",control:"🎛️",magnetic:"🧲",machine:"⚙️",power:"⚡",kec:"📐",exam:"📝"};
const catColors = {circuit:"#5aa9ff",control:"#3ddc84",magnetic:"#ffb454",machine:"#c792ff",power:"#ff6b6b",kec:"#3ddceb",exam:"#9aa7ba"};

const plan = [
 {d:1,dt:"2026-07-09",cat:"circuit",topic:"옴의 법칙 · KVL · KCL",
  f:["V=IR / KVL: 폐회로 전압합=0 / KCL: 분기점 전류합=0","도체저항: R=ρL/A [Ω] (ρ:고유저항, L:길이, A:단면적)"],
  t:["V=IR, I=V/R, R=V/I 문제 5개 풀기 (comcbt)"]},
 {d:2,dt:"2026-07-10",cat:"circuit",topic:"저항 직렬·병렬 합성 / 전류·전압 분배",
  f:["직렬: R합=R₁+R₂ / 전압분배: V₁=V×R₁/(R₁+R₂)","병렬: R합=R₁R₂/(R₁+R₂) / 전류분배: I₁=I×R₂/(R₁+R₂)"],
  t:["직병렬 합성저항 계산 기출 5문제","전류분배·전압분배 공식 손으로 3번 써보기"]},
 {d:3,dt:"2026-07-11",cat:"circuit",topic:"전력·전력량 / 밀만의 정리",
  f:["P=VI=I²R=V²/R [W] / W=Pt [J] (1Wh=3600J)","밀만의 정리: V0=(V1/R1+V2/R2+…)/(1/R1+1/R2+…) — 자주출제!"],
  t:["전력 P 계산 기출 3문제","밀만의 정리 적용 기출 2문제"]},
 {d:4,dt:"2026-07-12",cat:"circuit",topic:"중첩의 원리 · 테브난/노턴 정리",
  f:["테브난: 개방전압 Vth + 등가저항 Rth / 노턴: 단락전류 In"],
  t:["테브난 등가회로 변환 기출 3문제","중첩의 원리 전류 계산 기출 2문제"]},
 {d:5,dt:"2026-07-13",cat:"circuit",topic:"정현파 교류 · 페이저 · 실효값",
  f:["순시값 v=Vm sin(ωt+θ) / 실효값 V=Vm/√2≈0.707Vm / 평균값 Vav=2Vm/π≈0.637Vm","파고율=최대값/실효값(sin파=√2) / 파형률=실효값/평균값(sin파≈1.11)"],
  t:["실효값·최대값 변환 기출 3문제","위상차·위상관계 기출 2문제"]},
 {d:6,dt:"2026-07-14",cat:"circuit",topic:"R·L·C 임피던스 / 어드미턴스",
  f:["XL=ωL=2πfL / XC=1/ωC / Z=R+j(XL-XC)","|Z|=√(R²+(XL-XC)²) / Y=1/Z=G+jB"],
  t:["임피던스 크기·위상각 계산 기출 3문제","XL, XC 주파수 변화에 따른 변화 문제 2문제"]},
 {d:7,dt:"2026-07-15",cat:"circuit",topic:"RLC 공진 · 교류 전력 · 역률",
  f:["공진: XL=XC → f0=1/(2π√LC) / P=VIcosθ / cosθ=P/S / Q=VIsinθ"],
  t:["공진주파수 계산 기출 2문제","유효전력·무효전력·역률 계산 기출 3문제"]},
 {d:8,dt:"2026-07-16",cat:"circuit",topic:"3상회로 Y-Δ 변환·3상전력 / 과도현상 (2회독·총정리)",
  f:["Y결선: VL=√3Vp, IL=Ip / Δ결선: VL=Vp, IL=√3Ip","3상 전력: P=√3×VL×IL×cosθ=3×Vp×Ip×cosθ","RL회로: τ=L/R / RC회로: τ=RC / 5τ 후 정상상태(약99.3%)","RL전류 i(t)=I(1-e^(-t/τ)) / RC전압 v(t)=V(1-e^(-t/τ))"],
  t:["Y↔Δ 변환 전압·전류 계산 기출 3문제","시정수 계산 기출 2문제","회로이론 전체 기출 10문제 풀기 (comcbt.com 최근1개년)","틀린 문제 사진 찍어서 오답노트 채널 업로드","공식 요약노트 손으로 정리 (A4 1장)"]},
 {d:9,dt:"2026-07-17",cat:"control",topic:"기본 라플라스 변환쌍 완전 암기",
  f:["δ(t)→1 / u(t)=1→1/s / t→1/s² / t²→2/s³","e^(-at)→1/(s+a) / sinωt→ω/(s²+ω²) / cosωt→s/(s²+ω²) / te^(-at)→1/(s+a)²"],

  } catch(e){ return plan[0].d; }
}
function saveCurrentDay(v){
  localStorage.setItem(STORE_KEY2, String(v));
  if (fbRef && fbSyncReady) fbRef.child("currentDay").set(v);
}
let currentDay = loadCurrentDay();

// ==== Firebase 동기화 (모든 기기에서 체크/진행률 동일하게) ====
// 아래 firebaseConfig에 본인 프로젝트 설정을 붙여넣으세요.
// (기존 "hoho" 프로젝트를 재사용해도 되고, 새 프로젝트를 만들어도 됩니다.
//  단, 다른 도구와 데이터가 섞이지 않도록 DB_PATH는 이 앱 전용 이름을 씁니다.)
const firebaseConfig = {
  apiKey: "AIzaSyBbm0hy_qz_85UCSu2uLUCUN6zYhs-sAqo",
  authDomain: "hoho-a270e.firebaseapp.com",
  databaseURL: "https://hoho-a270e-default-rtdb.firebaseio.com",
  projectId: "hoho-a270e"
};
const DB_PATH = "elec49plan"; // 이 플랜 전용 경로 (다른 프로젝트와 안 겹침)

let fbRef = null;
let fbSyncReady = false; // 최초 원격 데이터 로드 전에는 쓰기를 막아 로컬(구버전) 값이 원격을 덮어쓰는 걸 방지
function fbEnabled(){ return firebaseConfig.apiKey !== "YOUR_API_KEY"; }

if (fbEnabled()) {
  try {
    firebase.initializeApp(firebaseConfig);
    fbRef = firebase.database().ref(DB_PATH);

    fbRef.once("value").then(snap => {
      if (snap.exists()) {
        const remote = snap.val();
        checks = remote.checks || {};
        currentDay = remote.currentDay || currentDay;
        saveChecks(checks);
        saveCurrentDayLocal(currentDay);
      } else {
        // 원격에 데이터가 없으면(최초 1회) 이 기기의 로컬 데이터를 올려서 시작점으로 삼음
        fbRef.set({ checks, currentDay });
      }
      fbSyncReady = true;
      initView(); renderTodayCard(); renderCalendars(); updateStats();

      // 다른 기기에서 바뀐 내용을 실시간으로 반영
      fbRef.child("checks").on("value", s => {
        checks = s.val() || {};
        saveChecks(checks);
        renderTodayCard(); renderCalendars(); updateStats();
      });
      fbRef.child("currentDay").on("value", s => {
        const v = s.val();
        if (v) { currentDay = v; saveCurrentDayLocal(v); renderTodayCard(); renderCalendars(); }
      });
    }).catch(err => console.warn("Firebase 초기 로드 실패, 로컬 데이터로 계속:", err));
  } catch (e) {
    console.warn("Firebase 초기화 실패, 로컬 저장만 사용:", e);
  }
}

// localStorage에만 쓰는 내부용 (원격 리스너가 currentDay를 바꿀 때 무한루프 방지)
function saveCurrentDayLocal(v){ localStorage.setItem(STORE_KEY2, String(v)); }

function dayProgress(day){
  const total = day.t.length;
  if (!total) return 0;
  let done = 0;
  day.t.forEach((_,i)=>{ if (checks[day.d+"_"+i]) done++; });
  return done/total;
}
function isDayDone(day){ return dayProgress(day) === 1; }

// 현재 학습일의 할 일을 모두 체크하면 다음 날로 진행, 체크 안 하면 그대로 유지
// 진행중인 학습일 = 아직 다 체크되지 않은 가장 빠른 Day
// 체크를 다 하면 다음 Day로 넘어가고, 이미 완료했던 Day의 체크를 해제하면 다시 그 Day로 돌아옵니다.
function advancePointer(){
  let d = 1;
  while (d <= lastDayNum && dataByDay[d] && isDayDone(dataByDay[d])) d++;
  currentDay = d;
  saveCurrentDay(currentDay);
}
advancePointer();

// ---- 현재 학습 카드 (실제 날짜가 아니라 진행 상황 기준) ----
// 체크를 다 하면 다음 Day로 넘어가고, 체크를 안 하면 같은 Day가 계속 유지됩니다.
function renderTodayCard(){
  const el = document.getElementById("todayCard");

  if (todayStr === examDate) {
    el.innerHTML = `<div class="today-card no-plan"><div class="tc-title">📝 오늘은 시험일입니다. 그동안 고생 많으셨어요! 화이팅 🔥</div></div>`;
    return;
  }
  if (currentDay > lastDayNum) {
    el.innerHTML = `<div class="today-card no-plan"><div class="tc-title">🎉 49일 플랜을 모두 완료했어요! 오답노트 복습하며 시험일까지 컨디션 유지하세요.</div></div>`;
    return;
  }
  const info = dataByDay[currentDay];
  if (!info) {
    el.innerHTML = `<div class="today-card no-plan"><div class="tc-title">계획을 불러올 수 없어요. 아래 달력에서 날짜를 확인해보세요 🙂</div></div>`;
    return;
  }
  const isRealToday = info.dt === todayStr;
  const tasksHtml = info.t.map((task,i)=>{
    const key = info.d+"_"+i;
    const isDone = !!checks[key];
    return `<div class="tc-task ${isDone?'done':''}" id="tctask-${key}">
      <input type="checkbox" id="tcchk-${key}" ${isDone?'checked':''} onchange="toggleTask('${key}')">
      <label for="tcchk-${key}">${task}</label>
    </div>`;
  }).join("");
  el.innerHTML = `
    <div class="today-card">
      <div class="tc-top">
        <span class="tc-label">${isRealToday ? "🌅 오늘의 학습" : "▶ 진행중인 학습"} · Day ${info.d}</span>
        <span class="tc-tag" style="background:${catColors[info.cat]}">${catIcons[info.cat]} ${catNames[info.cat]}</span>
      </div>
      <div class="tc-title">${info.topic}</div>
      <div class="tc-tasks">${tasksHtml}</div>
      <button class="tc-more" onclick="openSheet('${info.dt}')">📐 공식 + 상세 보기</button>
    </div>`;
}

// ---- 연속 완료일(스트릭) ----
function computeStreak(){
  let streak = 0;
  // 오늘 이전(오늘 포함하지 않음, 어제부터) 날짜들을 최신순으로 확인
  const past = orderedDates.filter(d => d < todayStr).sort().reverse();
  for (const d of past){
    const info = dataByDate[d];
    if (!info) continue;
    if (isDayDone(info)) streak++;
    else break;
  }
  // 오늘도 완료했으면 +1
  const todayInfo = dataByDate[todayStr];
  if (todayInfo && isDayDone(todayInfo)) streak++;
  return streak;
}

function updateStats(){
  const exam = new Date(examDate+"T00:00:00");
  const start = new Date(planStart+"T00:00:00");
  const now = new Date();
  const dday = Math.ceil((exam - now)/(1000*60*60*24));
  document.getElementById("dday").textContent = dday >= 0 ? "D-"+dday : "종료";

  const totalSpan = exam - start;
  const elapsed = now - start;
  const planPct = Math.min(100, Math.max(0, Math.round(elapsed/totalSpan*100)));
  document.getElementById("planpct").textContent = planPct+"%";
  document.getElementById("planbar").style.width = planPct+"%";

  let totalTasks=0, doneTasks=0;
  plan.forEach(p => { totalTasks += p.t.length; p.t.forEach((_,i)=>{ if(checks[p.d+"_"+i]) doneTasks++; }); });
  const pct = totalTasks ? Math.round(doneTasks/totalTasks*100) : 0;
  document.getElementById("pct").textContent = pct+"%";
  document.getElementById("pctbar").style.width = pct+"%";

  document.getElementById("streak").textContent = computeStreak()+"일";
}

function buildMonthGrid(year, month) {
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  let html = "";
  ["일","월","화","수","목","금","토"].forEach(w => html += `<div class="wd">${w}</div>`);
  for (let i=0;i<startDow;i++) html += `<div class="cell empty"></div>`;

  for (let day=1; day<=daysInMonth; day++) {
    const dateObj = new Date(year, month, day);
    const dateStr = fmtDate(dateObj);
    const info = dataByDate[dateStr];
    let cls = "cell";
    if (dateStr === todayStr) cls += " today";
    if (dateStr === examDate) cls += " exam";

    let inner = `<div class="date">${day}</div>`;
    if (dateStr === examDate) {
      inner += `<div class="tag" style="background:#ff6b6b;color:#12161c">📝 시험일</div>`;
      html += `<div class="${cls}">${inner}</div>`;
    } else if (info) {
      const prog = dayProgress(info);
      if (prog === 1) cls += " done";
      const badge = prog === 1 ? `<span class="check">✅</span>` : "";
      inner += `<div class="dnum">Day ${info.d}${info.d===currentDay ? `<span class="curbadge">▶ 진행중</span>` : ""}</div>`;
      inner += `<div class="tag c-${info.cat}">${catNames[info.cat]}</div>`;
      inner += `<div class="topic">${info.topic.length>16? info.topic.slice(0,16)+"…" : info.topic}</div>`;
      inner += badge;
      inner += `<div class="prog" style="width:${Math.round(prog*100)}%"></div>`;
      html += `<div class="${cls}" onclick="openSheet('${dateStr}')">${inner}</div>`;
    } else if (dateStr > "2026-08-25" && dateStr < examDate) {
      cls += " rest";
      inner += `<div class="topic" style="color:var(--subdim)">최종 점검/휴식</div>`;
      html += `<div class="${cls}">${inner}</div>`;
    } else {
      html += `<div class="${cls}">${inner}</div>`;
    }
  }
  return html;
}

// ---- 월 네비게이션 상태 ----
const planStartDate = new Date(planStart+"T00:00:00");
const examDateObj = new Date(examDate+"T00:00:00");
let viewYear, viewMonth;

function initView(){
  const anchor = dataByDay[currentDay] || plan[plan.length-1];
  const anchorDate = new Date(anchor.dt+"T00:00:00");
  viewYear = anchorDate.getFullYear();
  viewMonth = anchorDate.getMonth();
}

function isBeforeMinMonth(y,m){ return (y < planStartDate.getFullYear()) || (y===planStartDate.getFullYear() && m < planStartDate.getMonth()); }
function isAfterMaxMonth(y,m){ return (y > examDateObj.getFullYear()) || (y===examDateObj.getFullYear() && m > examDateObj.getMonth()); }

function prevMonth(){
  let y=viewYear, m=viewMonth-1;
  if (m<0){ m=11; y--; }
  if (isBeforeMinMonth(y,m)) return;
  viewYear=y; viewMonth=m; renderCalendars();
}
function nextMonth(){
  let y=viewYear, m=viewMonth+1;
  if (m>11){ m=0; y++; }
  if (isAfterMaxMonth(y,m)) return;
  viewYear=y; viewMonth=m; renderCalendars();
}

function renderCalendars(){
  document.getElementById("calTitle").textContent = `${viewYear}년 ${viewMonth+1}월`;
  document.getElementById("calGrid").innerHTML = buildMonthGrid(viewYear, viewMonth);
  document.getElementById("prevMonthBtn").disabled = isBeforeMinMonth(viewMonth===0?viewYear-1:viewYear, viewMonth===0?11:viewMonth-1);
  document.getElementById("nextMonthBtn").disabled = isAfterMaxMonth(viewMonth===11?viewYear+1:viewYear, viewMonth===11?0:viewMonth+1);
}

function openSheet(dateStr){
  const info = dataByDate[dateStr];
  if (!info) return;
  const d = new Date(dateStr+"T00:00:00");
  document.getElementById("sheetTitle").textContent = "Day "+info.d;
  const tagEl = document.getElementById("sheetTag");
  tagEl.textContent = catIcons[info.cat]+" "+catNames[info.cat];
  tagEl.style.background = catColors[info.cat];
  document.getElementById("sheetDate").textContent = (d.getMonth()+1)+"월 "+d.getDate()+"일";
  document.getElementById("sheetTopic").textContent = info.topic;

  const fWrap = document.getElementById("sheetFormulas");
  fWrap.innerHTML = (info.f||[]).map(f => `<div class="formula-box">${f}</div>`).join("");

  const tWrap = document.getElementById("sheetTasks");
  tWrap.innerHTML = info.t.map((task,i) => {
    const key = info.d+"_"+i;
    const isDone = !!checks[key];
    return `<div class="task ${isDone?'done':''}" id="task-${key}">
      <input type="checkbox" id="chk-${key}" ${isDone?'checked':''} onchange="toggleTask('${key}')">
      <label for="chk-${key}">${task}</label>
    </div>`;
  }).join("");

  document.getElementById("overlay").classList.add("show");
}
function openCheatOverlay(url, title){
  url = url || "cheatkey.html";
  const frame = document.getElementById("cheatFrame");
  if (frame.getAttribute("data-src") !== url) {
    frame.src = url; // 다른 링크면 새로 로드, 같은 링크면 그대로 유지
    frame.setAttribute("data-src", url);
  }
  document.getElementById("cheatTitle").textContent = "🔗 " + (title || "바로가기");
  document.getElementById("cheatOverlay").classList.add("show");
}
function closeCheatOverlay(){
  document.getElementById("cheatOverlay").classList.remove("show");
}

function closeSheet(){
  document.getElementById("overlay").classList.remove("show");
  renderCalendars();
  updateStats();
  renderTodayCard();
}
function toggleTask(key){
  checks[key] = !checks[key];
  saveChecks(checks);
  if (fbRef && fbSyncReady) fbRef.child("checks/"+key).set(checks[key]);
  advancePointer(); // 체크하면 다음 Day로, 체크 해제하면 진행중인 Day가 다시 그 Day로 돌아옴
  document.querySelectorAll(`#task-${key}, #tctask-${key}`).forEach(el=>{
    if (el) el.classList.toggle("done", checks[key]);
  });
  updateStats();
  renderTodayCard();
  renderCalendars();
}
document.getElementById("overlay").addEventListener("click", (e)=>{
  if (e.target.id === "overlay") closeSheet();
});

initView();
renderTodayCard();
renderCalendars();
updateStats();

// 백그라운드에 있다가 다시 열었을 때(홈화면 앱, 탭 전환 복귀 등) D-day를 새로 계산
function refreshOnReturn(){
  initView();
  renderTodayCard();
  renderCalendars();
  updateStats();
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refreshOnReturn();
});
window.addEventListener("pageshow", () => refreshOnReturn());
</script>
